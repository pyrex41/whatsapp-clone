# fly.toml app configuration file generated for globalbridge-backend on 2025-10-21T21:39:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'globalbridge-backend'
primary_region = 'ord'
kill_signal = 'SIGTERM'

[build]

[env]
  DATABASE_DIR = '/mnt/data'
  DATABASE_PATH = '/mnt/data/users.db'
  BRIDGE_DATABASE_PATH = '/mnt/data/bridges.db'
  SYNC_STATE_DATABASE_PATH = '/mnt/data/sync_state.db'
  THREAD_DATABASE_DIR = '/mnt/data/threads'
  # sqlite-vec shared library path inside the container (Linux ARM64/x86_64)
  SQLITE_VEC_PATH = '/usr/local/lib/vec0.so'
  PHX_HOST = 'globalbridge-backend.fly.dev'
  PORT = '8080'
  DEV_MODE = 'false'
  PHX_SERVER = 'true'
  TRANSLATION_MODEL="llama-3.3-70b-versatile"
  SUMMARIZER_MODEL="grok-4-fast-non-reasoning"

[[mounts]]
  source = 'data'
  destination = '/mnt/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
